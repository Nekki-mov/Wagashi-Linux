[core]
Include = /etc/pacman.d/mirrorlist

[extra]
Include = /etc/pacman.d/mirrorlist

[multilib]
Include = /etc/pacman.d/mirrorlist

[wagashi]
SigLevel = Optional TrustAll
Server = https://repo.neklair.es/x86_64
