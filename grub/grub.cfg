insmod part_gpt
insmod part_msdos
insmod fat
insmod iso9660
insmod all_video
insmod gfxterm
insmod png
insmod jpeg

set gfxmode=1920x1080,auto
terminal_output gfxterm
loadfont ($root)/boot/grub/themes/wagashi/wagashi-22.pf2
set theme=($root)/boot/grub/themes/wagashi/theme.txt
export theme

default=wagashi
timeout=10
timeout_style=menu

menuentry "Boot Wagashi Linux" --id 'wagashi' {
    set gfxpayload=keep
    linux /wagashi/boot/x86_64/vmlinuz-linux-zen archisobasedir=wagashi archisosearchuuid=%ARCHISO_UUID% quiet splash
    initrd /wagashi/boot/x86_64/initramfs-linux-zen.img
}

menuentry "Advanced Options" --id 'advanced' {
    set gfxpayload=keep
    linux /wagashi/boot/x86_64/vmlinuz-linux-zen archisobasedir=wagashi archisosearchuuid=%ARCHISO_UUID%
    initrd /wagashi/boot/x86_64/initramfs-linux-zen.img
}

menuentry "UEFI Firmware Settings" --id 'uefi-firmware' {
    fwsetup
}

menuentry "System shutdown" {
    halt
}

menuentry "System restart" {
    reboot
}
